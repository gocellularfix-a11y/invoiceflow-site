  <!-- Total row -->
  <rect x="152" y="313" width="54" height="10" rx="5" fill="#6366F1" fill-opacity="0.28"/>
  <rect x="244" y="313" width="56" height="10" rx="5" fill="#6366F1" fill-opacity="0.55"/>

  <!-- Green check badge -->
  <circle cx="318" cy="348" r="60" fill="#16A34A"/>
  <circle cx="318" cy="348" r="52" fill="#22C55E"/>
  <polyline
