  <!-- Folded corner cut -->
  <path d="M286 110 L342 166 L286 166 Z" fill="#C7C7F8"/>
  <path d="M286 110 L342 166 L286 166 L286 110" fill="#A5B4FC"/>

  <!-- Line items on document -->
  <rect x="152" y="196" width="76" height="10" rx="5" fill="#6366F1" fill-opacity="0.28"/>
  <rect x="152" y="222" width="130" height="10" rx="5" fill="#6366F1" fill-opacity="0.16"/>
  <rect x="152" y="245" width="110" height="10" rx="5" fill="#6366F1" fill-opacity="0.16"/>
  <rect x="152" y="268" width="90"  height="10" rx="5" fill="#6366F1" fill-opacity="0.16"/>

  <!-- Divider -->
